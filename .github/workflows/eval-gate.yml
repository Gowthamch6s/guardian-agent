name: Eval Gate

# Runs the golden-set eval against the real agent on every PR, then gates the
# merge on app/eval/gate.py's comparison to the committed baseline. This is
# the CI-enforced counterpart to a normal test-coverage gate, except the
# thing being gated is behavior quality/safety instead of code coverage.
#
# Runs against a local Ollama model (installed fresh on the runner) rather
# than a hosted API -- no secret to configure, no per-run API cost, and it
# keeps CI honest about testing the same free/local setup contributors run
# locally. Uses a smaller model tag than the interactive demo's default
# (llama3.2 vs. llama3.1) purely for CI wall-clock time; GitHub Actions
# minutes are free for public repos either way, so this is a UX tradeoff,
# not a cost one.

on:
  pull_request:
    branches: [master]
  workflow_dispatch: {}

env:
  GUARDIAN_LLM_MODEL: "ollama:llama3.2"

jobs:
  eval-gate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-models-${{ env.GUARDIAN_LLM_MODEL }}

      - name: Start Ollama and pull the model
        run: |
          ollama serve &
          for i in $(seq 1 30); do
            curl -sf http://localhost:11434 >/dev/null && break
            sleep 2
          done
          ollama pull "${GUARDIAN_LLM_MODEL#ollama:}"

      - name: Run golden-set eval
        run: python -m app.eval.run_eval

      - name: Compute guardrail-specific metrics
        run: python -m app.eval.guardrail_metrics

      - name: Evaluate regression gate
        id: gate
        continue-on-error: true
        run: python -m app.eval.gate

      # Posted even when the gate fails, so a reviewer sees the actual
      # numbers on the PR instead of just a red X with no context.
      - name: Comment gate results on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('eval_results/gate_report.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: report,
            });

      - name: Fail job if the gate did not pass
        if: steps.gate.outcome == 'failure'
        run: exit 1
